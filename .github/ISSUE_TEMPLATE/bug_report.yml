name: Bug Report
description: Report an issue or unexpected behavior in ShipLedger
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do NOT report security vulnerabilities here; refer to [SECURITY.md](../SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run workflow with config '...'
        2. Inspect output '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration (.shipledger.yml)
      description: Please share your `.shipledger.yml` configuration (ensure no secrets are included).
      render: yaml
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, Action version (e.g. node24, ubuntu-latest, v0.1.0)
      placeholder: "Node 24, Ubuntu Latest, ShipLedger v0.1.0"
    validations:
      required: true
